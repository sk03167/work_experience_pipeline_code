name: "Data Pipeline CI (Data Engineering Team)"

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - dev

jobs:
  lint-and-test:
    name: "Lint, Typecheck, and Test PySpark Transformations"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Data Engineering Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Java (OpenJDK 17 for Spark runner)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run PySpark Transformation Unit Tests
        run: pytest tests/unit/ -v --tb=short

